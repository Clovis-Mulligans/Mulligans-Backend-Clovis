<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulligans Admin - Pro Store Applications</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .filter-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-chip:hover {
      border-color: var(--brand-green);
    }

    .filter-chip.active {
      background: var(--brand-green-glow);
      border-color: var(--brand-green);
      color: var(--brand-green);
    }

    .seller-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .seller-type-badge.pro_shop {
      background: var(--brand-green-glow);
      color: var(--brand-green);
    }

    .seller-type-badge.online_retailer {
      background: var(--brand-blue-glow);
      color: var(--brand-blue);
    }

    .seller-type-badge.brand {
      background: rgba(245, 158, 11, 0.15);
      color: var(--status-warning);
    }

    .list-item-estimates {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--border-color);
    }

    .pagination button {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--brand-green);
      color: var(--text-primary);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination .page-info {
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 12px;
    }

    .detail-modal .modal {
      max-width: 900px;
    }

    .business-description {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 14px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .review-notes-block {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
    }

    .review-notes-block h4 {
      font-size: 13px;
      color: var(--status-info);
      margin-bottom: 6px;
    }

    .review-notes-block p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .review-notes-block .review-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .resolved-banner {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      border-left: 3px solid var(--text-muted);
    }

    .resolved-banner.approved {
      border-left-color: var(--status-success);
    }

    .resolved-banner.rejected {
      border-left-color: var(--status-error);
    }

    .resolved-banner h4 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .resolved-banner p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .resolved-banner .review-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .notes-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .notes-textarea:focus {
      outline: none;
      border-color: var(--brand-green);
    }

    .confirm-step {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      display: none;
    }

    .confirm-step.active {
      display: block;
    }

    .confirm-step.approve {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .confirm-step.info {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.2);
    }

    .confirm-step p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .confirm-step .confirm-actions {
      display: flex;
      gap: 8px;
    }

    .website-link {
      color: var(--brand-blue);
      text-decoration: none;
    }

    .website-link:hover {
      text-decoration: underline;
    }

    .banned-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      color: var(--status-error);
      margin-left: 6px;
    }
    .status-badge.info_requested {
  background: rgba(59, 130, 246, 0.15);
  color: var(--status-info);
}
  </style>
</head>
<body>
  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>🏌️ MULLIGANS</h1>
        <p>Admin Dashboard</p>
      </div>
      <div id="loginError" class="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="appContainer" class="app-container">
    <div id="sidebarContainer"></div>
    <div class="main-wrapper">
      <header class="main-header">
        <h1 class="page-title">🏪 Pro Store Applications</h1>
        <div class="header-actions">
          <button class="btn btn-ghost" onclick="loadData()">🔄 Refresh</button>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </header>
      <main class="main-content">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card clickable" onclick="setFilter('pending')">
            <div class="stat-icon orange">🟡</div>
            <div class="stat-content">
              <div class="stat-value" id="statPending">-</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="setFilter('approved')">
            <div class="stat-icon green">🟢</div>
            <div class="stat-content">
              <div class="stat-value" id="statApproved">-</div>
              <div class="stat-label">Approved</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="setFilter('rejected')">
            <div class="stat-icon red">🔴</div>
            <div class="stat-content">
              <div class="stat-value" id="statRejected">-</div>
              <div class="stat-label">Rejected</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="setFilter('info_requested')">
            <div class="stat-icon blue">🔵</div>
            <div class="stat-content">
              <div class="stat-value" id="statInfo">-</div>
              <div class="stat-label">Info Requested</div>
            </div>
          </div>
        </div>

        <!-- Filter Chips -->
        <div class="filter-chips">
          <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All</button>
          <button class="filter-chip" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
          <button class="filter-chip" data-filter="approved" onclick="setFilter('approved', this)">Approved</button>
          <button class="filter-chip" data-filter="rejected" onclick="setFilter('rejected', this)">Rejected</button>
          <button class="filter-chip" data-filter="info_requested" onclick="setFilter('info_requested', this)">Info Requested</button>
        </div>

        <!-- Application List -->
        <div class="list-container">
          <div id="listContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Loading applications...</p>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display: none;">
          <button id="prevPage" onclick="changePage(-1)">Previous</button>
          <span class="page-info" id="pageInfo">Page 1 of 1</span>
          <button id="nextPage" onclick="changePage(1)">Next</button>
        </div>
      </main>
    </div>
  </div>

  <!-- ==================== APPLICATION DETAIL MODAL ==================== -->
  <div id="detailModal" class="modal-overlay detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>🏪 Application Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="shared/auth.js"></script>
  <script src="shared/helpers.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    // ==================== STATE ====================
    let applications = [];
    let currentFilter = 'all';
    let currentPage = 1;
    let totalPages = 1;
    let totalItems = 0;
    let pendingCount = 0;
    let currentApplication = null;
    let confirmAction = null;
    const PAGE_SIZE = 20;

    // ==================== INITIALIZATION ====================
    function initPage() {
      initNav();
      loadData();
    }

    // ==================== DATA LOADING ====================
    async function loadData() {
      loadStats();
      loadApplications();
    }

    async function loadStats() {
      try {
        const [pRes, aRes, rRes, iRes] = await Promise.all([
          apiRequest(`${API_BASE}/pro-store/applications?status=pending&limit=1`),
          apiRequest(`${API_BASE}/pro-store/applications?status=approved&limit=1`),
          apiRequest(`${API_BASE}/pro-store/applications?status=rejected&limit=1`),
          apiRequest(`${API_BASE}/pro-store/applications?status=info_requested&limit=1`),
        ]);

        const pData = pRes.ok ? await pRes.json() : { total: 0 };
        const aData = aRes.ok ? await aRes.json() : { total: 0 };
        const rData = rRes.ok ? await rRes.json() : { total: 0 };
        const iData = iRes.ok ? await iRes.json() : { total: 0 };

        pendingCount = pData.total || 0;

        document.getElementById('statPending').textContent = pData.total || 0;
        document.getElementById('statApproved').textContent = aData.total || 0;
        document.getElementById('statRejected').textContent = rData.total || 0;
        document.getElementById('statInfo').textContent = iData.total || 0;

        updateNavBadge('proStore', pendingCount);
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function loadApplications() {
      const content = document.getElementById('listContent');
      content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading applications...</p></div>';

      try {
        let url = `${API_BASE}/pro-store/applications?page=${currentPage}&limit=${PAGE_SIZE}`;
        if (currentFilter !== 'all') {
          url += `&status=${currentFilter}`;
        }

        const response = await apiRequest(url);
        if (!response.ok) throw new Error('Failed to fetch applications');

        const data = await response.json();
        applications = data.applications || [];
        totalPages = data.totalPages || 1;
        totalItems = data.total || 0;

        renderList();
        updatePagination();
      } catch (error) {
        console.error('Load applications error:', error);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Failed to load applications</h3><p>Please try refreshing the page</p></div>';
      }
    }

    // ==================== FILTER ====================
    function setFilter(filter, chipEl) {
      currentFilter = filter;
      currentPage = 1;

      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      if (chipEl) {
        chipEl.classList.add('active');
      } else {
        const chip = document.querySelector(`.filter-chip[data-filter="${filter}"]`);
        if (chip) chip.classList.add('active');
      }

      loadApplications();
    }

    // ==================== PAGINATION ====================
    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage < 1 || newPage > totalPages) return;
      currentPage = newPage;
      loadApplications();
    }

    function updatePagination() {
      const paginationEl = document.getElementById('pagination');
      if (totalPages <= 1) {
        paginationEl.style.display = 'none';
        return;
      }
      paginationEl.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevPage').disabled = currentPage <= 1;
      document.getElementById('nextPage').disabled = currentPage >= totalPages;
    }

    // ==================== RENDER LIST ====================
    function renderList() {
      const content = document.getElementById('listContent');

      if (applications.length === 0) {
        const filterLabel = currentFilter === 'all' ? '' : currentFilter.replace('_', ' ');
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No ${filterLabel} applications</h3>
            <p>Applications in this category will appear here</p>
          </div>
        `;
        return;
      }

      content.innerHTML = applications.map(app => {
        const priorityClass = app.status === 'pending' ? 'medium'
          : app.status === 'approved' ? 'low'
          : app.status === 'rejected' ? 'high'
          : 'info';

        const priorityColor = app.status === 'pending' ? 'var(--status-warning)'
          : app.status === 'approved' ? 'var(--status-success)'
          : app.status === 'rejected' ? 'var(--status-error)'
          : 'var(--status-info)';

        return `
          <div class="list-item" onclick="openApplication('${escapeHtml(app.id)}')">
            <div class="list-item-priority" style="background: ${priorityColor};"></div>
            <div class="list-item-main">
              <div class="list-item-title">
                ${escapeHtml(app.business_name)}
                <span class="seller-type-badge ${escapeHtml(app.seller_type)}">${formatSellerType(app.seller_type)}</span>
              </div>
              <div class="list-item-meta">
                <span>${escapeHtml(app.user?.display_name || 'Unknown User')} • ${escapeHtml(app.user?.email || '')}</span>
              </div>
              <div class="list-item-estimates">Est. listings: ${escapeHtml(app.estimated_listings || '-')}</div>
            </div>
            <div class="list-item-info">
              <span class="status-badge ${app.status}">${formatAppStatus(app.status)}</span>
              <div class="list-item-age">${getAge(app.created_at)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== HELPERS ====================
    function formatSellerType(type) {
      const map = {
        'pro_shop': 'Pro Shop',
        'online_retailer': 'Online Retailer',
        'brand': 'Brand',
      };
      return map[type] || type;
    }

    function formatAppStatus(status) {
      const map = {
        'pending': 'Pending',
        'approved': 'Approved',
        'rejected': 'Rejected',
        'info_requested': 'Info Requested',
      };
      return map[status] || status;
    }

    // ==================== APPLICATION DETAIL ====================
    async function openApplication(id) {
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modalContent');
      modal.classList.add('active');
      content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      confirmAction = null;

      try {
        const response = await apiRequest(`${API_BASE}/pro-store/applications/${id}`);
        if (!response.ok) throw new Error('Failed to fetch application');

        const data = await response.json();
        currentApplication = data.application;
        renderDetail();
      } catch (error) {
        console.error('Open application error:', error);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load application</p></div>';
      }
    }

    function renderDetail() {
      const app = currentApplication;
      if (!app) return;

      const content = document.getElementById('modalContent');
      const user = app.user || {};
      const canAct = app.status === 'pending' || app.status === 'info_requested';

      content.innerHTML = `
        <!-- Section 1: Applicant Info -->
        <div class="detail-section">
          <h3>👤 Applicant</h3>
          <div class="detail-grid">
            <div class="detail-card">
              <div class="detail-row">
                <span class="detail-label">Display Name</span>
                <span class="detail-value">${escapeHtml(user.display_name || '-')}${user.is_banned ? '<span class="banned-tag">BANNED</span>' : ''}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value">${escapeHtml(user.email || '-')}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Member Since</span>
                <span class="detail-value">${formatDate(user.created_at)}</span>
              </div>
            </div>
            <div class="detail-card">
              <div class="detail-row">
                <span class="detail-label">Total Sales</span>
                <span class="detail-value">${user.total_sales || 0}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Verified Seller</span>
                <span class="detail-value">${user.is_verified_seller ? '✅ Yes' : '❌ No'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Account Status</span>
                <span class="detail-value">${user.is_banned ? '<span style="color: var(--status-error);">Banned</span>' : '<span style="color: var(--status-success);">Active</span>'}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 2: Business Details -->
        <div class="detail-section" style="margin-top: 20px;">
          <h3>🏪 Business Details</h3>
          <div class="detail-card">
            <div class="detail-row">
              <span class="detail-label">Business Name</span>
              <span class="detail-value">${escapeHtml(app.business_name)}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Business Email</span>
              <span class="detail-value">${escapeHtml(app.business_email)}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Business Phone</span>
              <span class="detail-value">${escapeHtml(app.business_phone)}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Website</span>
              <span class="detail-value">${app.website ? `<a href="${escapeHtml(app.website)}" target="_blank" rel="noopener noreferrer" class="website-link">${escapeHtml(app.website)} ↗</a>` : '-'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Seller Type</span>
              <span class="detail-value"><span class="seller-type-badge ${escapeHtml(app.seller_type)}">${formatSellerType(app.seller_type)}</span></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Estimated Listings</span>
              <span class="detail-value">${escapeHtml(app.estimated_listings || '-')}</span>
            </div>
            ${app.instagram_handle ? `
              <div class="detail-row">
                <span class="detail-label">Instagram</span>
                <span class="detail-value">${escapeHtml(app.instagram_handle)}</span>
              </div>
            ` : ''}
            ${app.has_existing_store && app.existing_store_url ? `
              <div class="detail-row">
                <span class="detail-label">Existing Store</span>
                <span class="detail-value"><a href="${escapeHtml(app.existing_store_url)}" target="_blank" rel="noopener noreferrer" class="website-link">${escapeHtml(app.existing_store_url)} ↗</a></span>
              </div>
            ` : ''}
          </div>
          <div class="business-description">${escapeHtml(app.description)}</div>
        </div>

        <!-- Section 3: Review Notes (if any) -->
        ${app.review_notes ? `
          <div class="review-notes-block" style="margin-top: 20px;">
            <h4>📝 Review Notes</h4>
            <p>${escapeHtml(app.review_notes)}</p>
            ${app.reviewed_by || app.reviewed_at ? `
              <div class="review-meta">
                ${app.reviewed_by ? `Reviewed by: ${escapeHtml(app.reviewed_by)}` : ''}
                ${app.reviewed_at ? ` • ${formatDate(app.reviewed_at)}` : ''}
              </div>
            ` : ''}
          </div>
        ` : ''}

        <!-- Section 4: Actions or Resolved Banner -->
        ${canAct ? `
          <div style="margin-top: 20px;">
            <h3>⚡ Actions</h3>
            <textarea class="notes-textarea" id="reviewNotes" placeholder="Add review notes (required for rejection or info request, optional for approval)"></textarea>

            <div class="action-buttons">
              <button class="btn btn-success" onclick="showConfirm('approve')">✅ Approve</button>
              <button class="btn btn-warning" onclick="showConfirm('info_requested')">ℹ️ Request Info</button>
              <button class="btn btn-danger" onclick="showConfirm('reject')">❌ Reject</button>
            </div>

            <div class="confirm-step approve" id="confirmApprove">
              <p>Are you sure you want to <strong>approve</strong> this application? This will grant pro store access to ${escapeHtml(app.business_name)}.</p>
              <div class="confirm-actions">
                <button class="btn btn-ghost" onclick="hideConfirm()">Cancel</button>
                <button class="btn btn-success" onclick="submitReview('approve')">Confirm Approval</button>
              </div>
            </div>

            <div class="confirm-step info" id="confirmInfo">
              <p>Are you sure you want to <strong>request more info</strong> from this applicant?</p>
              <div class="confirm-actions">
                <button class="btn btn-ghost" onclick="hideConfirm()">Cancel</button>
                <button class="btn btn-warning" onclick="submitReview('info_requested')">Confirm Request</button>
              </div>
            </div>

            <div class="confirm-step" id="confirmReject">
              <p>Are you sure you want to <strong>reject</strong> this application? This cannot be easily undone.</p>
              <div class="confirm-actions">
                <button class="btn btn-ghost" onclick="hideConfirm()">Cancel</button>
                <button class="btn btn-danger" onclick="submitReview('reject')">Confirm Rejection</button>
              </div>
            </div>
          </div>
        ` : `
          <div class="resolved-banner ${app.status}" style="margin-top: 20px;">
            <h4>${app.status === 'approved' ? '✅ Application Approved' : app.status === 'rejected' ? '❌ Application Rejected' : '📋 ' + formatAppStatus(app.status)}</h4>
            ${app.review_notes ? `<p>${escapeHtml(app.review_notes)}</p>` : ''}
            <div class="review-meta">
              ${app.reviewed_by ? `Reviewed by: ${escapeHtml(app.reviewed_by)}` : ''}
              ${app.reviewed_at ? ` • ${formatDate(app.reviewed_at)}` : ''}
            </div>
          </div>
        `}
      `;
    }

    // ==================== CONFIRM STEP ====================
    function showConfirm(action) {
      hideConfirm();
      confirmAction = action;

      const notes = document.getElementById('reviewNotes')?.value?.trim() || '';
      if ((action === 'reject' || action === 'info_requested') && !notes) {
        showToast('Please add review notes before ' + (action === 'reject' ? 'rejecting' : 'requesting info'), 'error');
        document.getElementById('reviewNotes')?.focus();
        return;
      }

      const id = action === 'approve' ? 'confirmApprove'
        : action === 'info_requested' ? 'confirmInfo'
        : 'confirmReject';
      document.getElementById(id)?.classList.add('active');
    }

    function hideConfirm() {
      confirmAction = null;
      document.querySelectorAll('.confirm-step').forEach(el => el.classList.remove('active'));
    }

    // ==================== SUBMIT REVIEW ====================
    async function submitReview(action) {
      if (!currentApplication) return;

      const notes = document.getElementById('reviewNotes')?.value?.trim() || '';

      try {
        const response = await apiRequest(`${API_BASE}/pro-store/applications/${currentApplication.id}/review`, {
          method: 'PATCH',
          body: { action, review_notes: notes || undefined },
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'Failed to submit review');
        }

        const label = action === 'approve' ? 'approved' : action === 'reject' ? 'rejected' : 'info requested';
        showToast(`Application ${label} successfully`, 'success');
        closeModal();
        loadData();
      } catch (error) {
        console.error('Submit review error:', error);
        showToast(error.message || 'Failed to submit review', 'error');
      }
    }

    // ==================== MODAL ====================
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      currentApplication = null;
      confirmAction = null;
    }
  </script>
</body>
</html>
