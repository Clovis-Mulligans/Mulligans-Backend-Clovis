<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulligans Admin - User Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>🏌️ MULLIGANS</h1>
        <p>Admin Dashboard</p>
      </div>
      <div id="loginError" class="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="appContainer" class="app-container">
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    
    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="main-header">
        <h1 class="page-title">🚩 User Reports</h1>
        <div class="header-actions">
          <button class="btn btn-ghost" onclick="loadReports()">🔄 Refresh</button>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </header>
      
      <main class="main-content">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card clickable" onclick="switchTab('pending')">
            <div class="stat-icon orange">🟠</div>
            <div class="stat-content">
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">Pending Reports</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="switchTab('reviewed')">
            <div class="stat-icon blue">🔵</div>
            <div class="stat-content">
              <div class="stat-value" id="statReviewed">0</div>
              <div class="stat-label">Under Review</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="switchTab('resolved')">
            <div class="stat-icon green">🟢</div>
            <div class="stat-content">
              <div class="stat-value" id="statResolved">0</div>
              <div class="stat-label">Resolved</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">📊</div>
            <div class="stat-content">
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Reports</div>
            </div>
          </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs-container">
          <div class="tabs">
            <div class="tab active" data-tab="pending" onclick="switchTab('pending')">
              <span>🟠 Pending</span>
              <span class="tab-badge urgent" id="tabPending">0</span>
            </div>
            <div class="tab" data-tab="reviewed" onclick="switchTab('reviewed')">
              <span>🔵 Under Review</span>
              <span class="tab-badge" id="tabReviewed">0</span>
            </div>
            <div class="tab" data-tab="resolved" onclick="switchTab('resolved')">
              <span>🟢 Resolved</span>
              <span class="tab-badge" id="tabResolved">0</span>
            </div>
            <div class="tab" data-tab="dismissed" onclick="switchTab('dismissed')">
              <span>⚪ Dismissed</span>
              <span class="tab-badge" id="tabDismissed">0</span>
            </div>
          </div>
        </div>
        
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search by username or email..." oninput="handleSearch()">
          </div>
          <div class="toolbar-right">
            <select class="sort-select" id="sortSelect" onchange="handleSort()">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
        
        <!-- Reports List -->
        <div class="list-container">
          <div id="reportsContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Loading reports...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ==================== REPORT DETAIL MODAL ==================== -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>🚩 Report Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== IMAGE MODAL ==================== -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="imageModalImg" src="" alt="Image">
  </div>

  <!-- Scripts -->
  <script src="shared/auth.js"></script>
  <script src="shared/helpers.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    // ==================== STATE ====================
    let reports = [];
    let stats = {};
    let currentTab = 'pending';
    let currentReport = null;
    let searchQuery = '';
    let sortBy = 'newest';

    // ==================== INITIALIZATION ====================
    function initPage() {
      initNav();
      loadReports();
    }

    // ==================== DATA LOADING ====================
    async function loadReports() {
      const content = document.getElementById('reportsContent');
      content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading reports...</p></div>';

      try {
        const response = await apiRequest(`${API_BASE}/reports`);

        if (!response.ok) throw new Error('Failed to fetch reports');

        const data = await response.json();
        reports = data.reports || [];
        stats = data.stats || {};

        updateStats();
        renderReports();
        
        // Update nav badge
        updateNavBadge('reports', stats.pending || 0);
      } catch (error) {
        console.error('Load reports error:', error);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Failed to load reports</h3><p>Please try refreshing the page</p></div>';
      }
    }

    // ==================== STATS ====================
    function updateStats() {
      document.getElementById('statPending').textContent = stats.pending || 0;
      document.getElementById('statReviewed').textContent = stats.reviewed || 0;
      document.getElementById('statResolved').textContent = stats.resolved || 0;
      document.getElementById('statTotal').textContent = 
        (stats.pending || 0) + (stats.reviewed || 0) + 
        (stats.resolved || 0) + (stats.dismissed || 0);
      
      document.getElementById('tabPending').textContent = stats.pending || 0;
      document.getElementById('tabReviewed').textContent = stats.reviewed || 0;
      document.getElementById('tabResolved').textContent = stats.resolved || 0;
      document.getElementById('tabDismissed').textContent = stats.dismissed || 0;
    }

    // ==================== TABS & FILTERING ====================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      renderReports();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      renderReports();
    }

    function handleSort() {
      sortBy = document.getElementById('sortSelect').value;
      renderReports();
    }

    // ==================== RENDER ====================
    function renderReports() {
      const content = document.getElementById('reportsContent');
      
      let filtered = reports.filter(r => r.status === currentTab);
      
      if (searchQuery) {
        filtered = filtered.filter(r =>
          r.reported_user?.display_name?.toLowerCase().includes(searchQuery) ||
          r.reported_user?.email?.toLowerCase().includes(searchQuery) ||
          r.reporter?.display_name?.toLowerCase().includes(searchQuery)
        );
      }
      
      filtered.sort((a, b) => {
        if (sortBy === 'newest') return new Date(b.created_at) - new Date(a.created_at);
        if (sortBy === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
        return 0;
      });

      if (filtered.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No ${currentTab} reports</h3>
            <p>Reports in this category will appear here</p>
          </div>
        `;
        return;
      }

      content.innerHTML = filtered.map(r => `
        <div class="list-item" onclick="openReport('${r.id}')">
          <div class="list-item-priority ${r.reason === 'scam' ? 'high' : r.reason === 'inappropriate_messages' ? 'medium' : 'low'}"></div>
          <div class="user-card-avatar" style="width: 48px; height: 48px; font-size: 18px; flex-shrink: 0;">
            ${(r.reported_user?.display_name || 'U').charAt(0).toUpperCase()}
          </div>
          <div class="list-item-main">
            <div class="list-item-title">${escapeHtml(r.reported_user?.display_name || 'Unknown User')}</div>
            <div class="list-item-meta">
              <span>Reported by: ${escapeHtml(r.reporter?.display_name || 'Unknown')}</span>
              <span class="report-reason ${r.reason === 'scam' ? 'scam' : r.reason === 'inappropriate_messages' ? 'inappropriate' : 'other'}">
                ${formatReportReason(r.reason)}
              </span>
            </div>
          </div>
          <div class="list-item-info">
            <span class="status-badge ${r.status}">${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span>
            <div class="list-item-age">${getAge(r.created_at)}</div>
          </div>
        </div>
      `).join('');
    }

    // ==================== REPORT DETAIL ====================
    async function openReport(id) {
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modalContent');
      modal.classList.add('active');
      content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await apiRequest(`${API_BASE}/reports/${id}`);

        if (!response.ok) throw new Error('Failed to fetch report');

        const data = await response.json();
        currentReport = data.report;
        
        content.innerHTML = `
          <div class="detail-section">
            <h3>🚩 Report Information</h3>
            <div class="detail-card">
              <div class="detail-row">
                <span class="detail-label">Reason</span>
                <span class="detail-value">
                  <span class="report-reason ${currentReport.reason === 'scam' ? 'scam' : currentReport.reason === 'inappropriate_messages' ? 'inappropriate' : 'other'}">
                    ${formatReportReason(currentReport.reason)}
                  </span>
                </span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value">
                  <span class="status-badge ${currentReport.status}">${currentReport.status.charAt(0).toUpperCase() + currentReport.status.slice(1)}</span>
                </span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Reported On</span>
                <span class="detail-value">${formatDate(currentReport.created_at)}</span>
              </div>
              ${currentReport.details ? `
                <div class="detail-row">
                  <span class="detail-label">Notes</span>
                  <span class="detail-value">${escapeHtml(currentReport.details)}</span>
                </div>
              ` : ''}
            </div>
          </div>

          <div class="detail-section" style="margin-top: 20px;">
            <h3>👤 Reported User</h3>
            <div class="user-card">
              <div class="user-card-avatar">${(currentReport.reported_user?.display_name || 'U').charAt(0).toUpperCase()}</div>
              <div class="user-card-info">
                <h4>${escapeHtml(currentReport.reported_user?.display_name || 'Unknown')}</h4>
                <p>${escapeHtml(currentReport.reported_user?.email || '')}</p>
                <p style="font-size: 12px; margin-top: 4px; color: var(--text-muted);">
                  Joined: ${formatDate(currentReport.reported_user?.created_at)} • 
                  Sales: ${currentReport.reported_user?.total_sales || 0} •
                  ${data.previousReports || 0} previous reports
                </p>
              </div>
            </div>
          </div>

          <div class="detail-section" style="margin-top: 20px;">
            <h3>📝 Reporter</h3>
            <div class="user-card">
              <div class="user-card-avatar" style="background: var(--text-muted);">${(currentReport.reporter?.display_name || 'U').charAt(0).toUpperCase()}</div>
              <div class="user-card-info">
                <h4>${escapeHtml(currentReport.reporter?.display_name || 'Unknown')}</h4>
                <p>${escapeHtml(currentReport.reporter?.email || '')}</p>
              </div>
            </div>
          </div>

          ${currentReport.status === 'pending' || currentReport.status === 'reviewed' ? `
            <div class="action-buttons">
              <button class="btn btn-secondary" onclick="updateReportStatus('dismissed')">
                ⚪ Dismiss
              </button>
              ${currentReport.status === 'pending' ? `
                <button class="btn btn-warning" onclick="updateReportStatus('reviewed')">
                  🔵 Mark as Reviewing
                </button>
              ` : ''}
              <button class="btn btn-success" onclick="updateReportStatus('resolved')">
                ✅ Mark Resolved
              </button>
              <button class="btn btn-danger" onclick="banUser()">
                🚫 Ban User
              </button>
            </div>
          ` : ''}
        `;
      } catch (error) {
        console.error('Open report error:', error);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load report</p></div>';
      }
    }

    // ==================== ACTIONS ====================
    async function updateReportStatus(status) {
      if (!currentReport) return;

      try {
        const response = await apiRequest(`${API_BASE}/reports/${currentReport.id}`, {
          method: 'PATCH',
          body: { status },
        });

        if (response.ok) {
          alert(`Report marked as ${status}`);
          closeModal();
          loadReports();
        } else {
          alert('Failed to update report');
        }
      } catch (error) {
        console.error('Update report error:', error);
        alert('Failed to update report');
      }
    }

    async function banUser() {
      if (!currentReport) return;

      const reason = prompt('Enter ban reason:');
      if (!reason) return;

      if (!confirm(`Are you sure you want to ban ${currentReport.reported_user?.display_name}? This will deactivate all their listings.`)) {
        return;
      }

      try {
        const response = await apiRequest(`${API_BASE}/reports/${currentReport.id}/ban-user`, {
          method: 'POST',
          body: { reason },
        });

        if (response.ok) {
          alert('User banned successfully. All their listings have been deactivated.');
          closeModal();
          loadReports();
        } else {
          alert('Failed to ban user');
        }
      } catch (error) {
        console.error('Ban user error:', error);
        alert('Failed to ban user');
      }
    }

    // ==================== MODAL ====================
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      currentReport = null;
    }
  </script>
</body>
</html>
