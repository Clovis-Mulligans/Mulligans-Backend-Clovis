<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulligans Admin - Returns</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>🏌️ MULLIGANS</h1>
        <p>Admin Dashboard</p>
      </div>
      <div id="loginError" class="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="appContainer" class="app-container">
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    
    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="main-header">
        <h1 class="page-title">📦 Returns</h1>
        <div class="header-actions">
          <button class="btn btn-ghost" onclick="loadReturns()">🔄 Refresh</button>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </header>
      
      <main class="main-content">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card clickable" onclick="switchTab('pending')">
            <div class="stat-icon yellow">🟡</div>
            <div class="stat-content">
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">Pending / Labels</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="switchTab('in_transit')">
            <div class="stat-icon blue">🔵</div>
            <div class="stat-content">
              <div class="stat-value" id="statInTransit">0</div>
              <div class="stat-label">In Transit</div>
            </div>
          </div>
          <div class="stat-card clickable" onclick="switchTab('delivered')">
            <div class="stat-icon green">🟢</div>
            <div class="stat-content">
              <div class="stat-value" id="statDelivered">0</div>
              <div class="stat-label">Awaiting Refund</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">📊</div>
            <div class="stat-content">
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Returns</div>
            </div>
          </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs-container">
          <div class="tabs">
            <div class="tab active" data-tab="pending" onclick="switchTab('pending')">
              <span>🟡 Pending</span>
              <span class="tab-badge urgent" id="tabPending">0</span>
            </div>
            <div class="tab" data-tab="in_transit" onclick="switchTab('in_transit')">
              <span>🔵 In Transit</span>
              <span class="tab-badge" id="tabInTransit">0</span>
            </div>
            <div class="tab" data-tab="delivered" onclick="switchTab('delivered')">
              <span>🟢 Delivered</span>
              <span class="tab-badge" id="tabDelivered">0</span>
            </div>
            <div class="tab" data-tab="completed" onclick="switchTab('completed')">
              <span>✅ Completed</span>
              <span class="tab-badge" id="tabCompleted">0</span>
            </div>
          </div>
        </div>
        
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search by order ID or user..." oninput="handleSearch()">
          </div>
          <div class="toolbar-right">
            <select class="sort-select" id="sortSelect" onchange="handleSort()">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
        
        <!-- Returns List -->
        <div class="list-container">
          <div id="returnsContent">
            <div class="loading">
              <div class="spinner"></div>
              <p>Loading returns...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ==================== RETURN DETAIL MODAL ==================== -->
  <div id="detailModal" class="modal-overlay">
    <div class="modal" style="max-width: 900px;">
      <div class="modal-header">
        <h2>📦 Return Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== IMAGE MODAL ==================== -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="imageModalImg" src="" alt="Image">
  </div>

  <!-- Scripts -->
  <script src="shared/auth.js"></script>
  <script src="shared/helpers.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    // ==================== STATE ====================
    let returns = [];
    let stats = {};
    let currentTab = 'pending';
    let currentReturn = null;
    let searchQuery = '';
    let sortBy = 'newest';

    // ==================== INITIALIZATION ====================
    function initPage() {
      initNav();
      loadReturns();
    }

    // ==================== DATA LOADING ====================
    async function loadReturns() {
      try {
        const response = await apiRequest(`${API_BASE}/returns?tab=${currentTab}`);

        if (!response.ok) throw new Error('Failed to load');

        const data = await response.json();
        returns = data.returns || [];
        stats = data.stats || {};
        updateStats();
        renderReturns();
        
        // Update nav badge
        const needsAttention = (stats.pending || 0) + (stats.delivered || 0);
        updateNavBadge('returns', needsAttention);
      } catch (error) {
        console.error('Failed to load returns:', error);
        document.getElementById('returnsContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <h3>Failed to load returns</h3>
            <p>Please try refreshing the page</p>
          </div>
        `;
      }
    }

    // ==================== STATS ====================
    function updateStats() {
      document.getElementById('statPending').textContent = stats.pending || 0;
      document.getElementById('statInTransit').textContent = stats.in_transit || 0;
      document.getElementById('statDelivered').textContent = stats.delivered || 0;
      document.getElementById('statTotal').textContent = stats.total || 0;

      document.getElementById('tabPending').textContent = stats.pending || 0;
      document.getElementById('tabInTransit').textContent = stats.in_transit || 0;
      document.getElementById('tabDelivered').textContent = stats.delivered || 0;
      document.getElementById('tabCompleted').textContent = stats.completed || 0;
    }

    // ==================== TABS & FILTERING ====================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      loadReturns();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderReturns();
    }

    function handleSort() {
      sortBy = document.getElementById('sortSelect').value;
      renderReturns();
    }

    function getFilteredReturns() {
      let filtered = returns;

      // Search filter
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(r => 
          r.order_id.toLowerCase().includes(q) ||
          r.requester.display_name.toLowerCase().includes(q) ||
          (r.order.listing_title || '').toLowerCase().includes(q)
        );
      }

      // Sort
      filtered.sort((a, b) => {
        if (sortBy === 'oldest') {
          return new Date(a.created_at) - new Date(b.created_at);
        }
        return new Date(b.created_at) - new Date(a.created_at);
      });

      return filtered;
    }

    // ==================== RENDER ====================
    function renderReturns() {
      const filtered = getFilteredReturns();
      const container = document.getElementById('returnsContent');

      if (filtered.length === 0) {
        const emptyMessages = {
          pending: { icon: '✅', title: 'All clear!', desc: 'No pending returns right now.' },
          in_transit: { icon: '📭', title: 'None in transit', desc: 'No returns being shipped at the moment.' },
          delivered: { icon: '✅', title: 'All processed', desc: 'No returns awaiting refund.' },
          completed: { icon: '📋', title: 'No history yet', desc: 'Completed returns will appear here.' },
        };
        const msg = emptyMessages[currentTab] || emptyMessages.pending;
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${msg.icon}</div>
            <h3>${msg.title}</h3>
            <p>${msg.desc}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(r => {
        const age = getAge(r.created_at);
        const priority = getReturnPriority(r);

        return `
          <div class="list-item" onclick="openReturn('${r.id}')">
            <div class="return-priority ${priority}"></div>
            <img class="list-item-image" src="${r.order.listing_image || 'https://via.placeholder.com/48?text=No+Image'}" alt="">
            <div class="list-item-main">
              <div class="list-item-title">${escapeHtml(r.order.listing_title || 'Item')}</div>
              <div class="list-item-meta">
                <span>By: ${escapeHtml(r.requester.display_name)}</span>
                <span class="status-badge ${r.status}">${formatReturnStatus(r.status)}</span>
                ${r.return_tracking_number ? `<span>📦 ${r.return_tracking_number}</span>` : ''}
              </div>
            </div>
            <div class="list-item-info">
              <div class="list-item-amount">£${r.order.amount.toFixed(2)}</div>
              <div class="list-item-age">${age}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== RETURN DETAIL ====================
    async function openReturn(id) {
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('modalContent');
      modal.classList.add('active');
      content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await apiRequest(`${API_BASE}/returns/${id}`);

        if (!response.ok) throw new Error('Failed to fetch return');

        const data = await response.json();
        currentReturn = data.return;
        
        content.innerHTML = `
          <div class="detail-grid">
            <!-- Order Info -->
            <div class="detail-section">
              <h3>📦 Order Information</h3>
              <div class="detail-card">
                <div class="detail-row">
                  <span class="detail-label">Order ID</span>
                  <span class="detail-value" style="font-family: monospace; font-size: 11px;">${currentReturn.order_id}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Item</span>
                  <span class="detail-value">${escapeHtml(currentReturn.order.listing_title)}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Order Amount</span>
                  <span class="detail-value">£${currentReturn.order.amount.toFixed(2)}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Order Date</span>
                  <span class="detail-value">${formatDate(currentReturn.order.created_at)}</span>
                </div>
              </div>
            </div>

            <!-- Return Status -->
            <div class="detail-section">
              <h3>📋 Return Status</h3>
              <div class="detail-card">
                <div class="detail-row">
                  <span class="detail-label">Status</span>
                  <span class="detail-value">
                    <span class="status-badge ${currentReturn.status}">${formatReturnStatus(currentReturn.status)}</span>
                  </span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Requested On</span>
                  <span class="detail-value">${formatDate(currentReturn.created_at)}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Paid By</span>
                  <span class="detail-value">${currentReturn.paid_by === 'buyer' ? '👤 Buyer' : '🏪 Seller'}</span>
                </div>
                ${currentReturn.reason ? `
                  <div class="detail-row">
                    <span class="detail-label">Reason</span>
                    <span class="detail-value">${escapeHtml(currentReturn.reason)}</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Shipping Info -->
            ${currentReturn.return_tracking_number || currentReturn.return_carrier ? `
              <div class="detail-section">
                <h3>🚚 Shipping Label</h3>
                <div class="detail-card">
                  ${currentReturn.return_carrier ? `
                    <div class="detail-row">
                      <span class="detail-label">Carrier</span>
                      <span class="detail-value">${currentReturn.return_carrier}</span>
                    </div>
                  ` : ''}
                  ${currentReturn.return_tracking_number ? `
                    <div class="detail-row">
                      <span class="detail-label">Tracking #</span>
                      <span class="detail-value" style="font-family: monospace;">${currentReturn.return_tracking_number}</span>
                    </div>
                  ` : ''}
                  ${currentReturn.label_cost ? `
                    <div class="detail-row">
                      <span class="detail-label">Label Cost</span>
                      <span class="detail-value">£${currentReturn.label_cost.toFixed(2)}</span>
                    </div>
                  ` : ''}
                  ${currentReturn.return_label_url ? `
                    <div style="margin-top: 12px;">
                      <a href="${currentReturn.return_label_url}" target="_blank" class="btn btn-secondary" style="width: 100%;">
                        🏷️ View Shipping Label
                      </a>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : ''}

            <!-- Parties -->
            <div class="detail-section">
              <h3>👥 Parties</h3>
              <div class="detail-card">
                <div class="detail-row">
                  <span class="detail-label">Buyer</span>
                  <span class="detail-value">${escapeHtml(currentReturn.order.buyer?.display_name || 'Unknown')}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Seller</span>
                  <span class="detail-value">${escapeHtml(currentReturn.order.seller?.display_name || 'Unknown')}</span>
                </div>
                ${currentReturn.order.seller?.stripe_account_id ? `
                  <div class="detail-row">
                    <span class="detail-label">Seller Stripe</span>
                    <span class="detail-value" style="font-size: 11px; font-family: monospace;">Connected ✅</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Timeline -->
            <div class="detail-section full-width">
              <h3>📅 Timeline</h3>
              <div class="detail-card">
                <div class="timeline">
                  <div class="timeline-item">
                    <div class="timeline-dot active"></div>
                    <div class="timeline-content">
                      <h4>Return Requested</h4>
                      <p>${formatDate(currentReturn.created_at)}</p>
                    </div>
                  </div>
                  ${currentReturn.approved_at ? `
                    <div class="timeline-item">
                      <div class="timeline-dot active"></div>
                      <div class="timeline-content">
                        <h4>Return Approved</h4>
                        <p>${formatDate(currentReturn.approved_at)}</p>
                      </div>
                    </div>
                  ` : ''}
                  ${currentReturn.label_created_at ? `
                    <div class="timeline-item">
                      <div class="timeline-dot active"></div>
                      <div class="timeline-content">
                        <h4>Label Created</h4>
                        <p>${formatDate(currentReturn.label_created_at)}</p>
                      </div>
                    </div>
                  ` : ''}
                  ${currentReturn.shipped_at ? `
                    <div class="timeline-item">
                      <div class="timeline-dot active"></div>
                      <div class="timeline-content">
                        <h4>Item Shipped</h4>
                        <p>${formatDate(currentReturn.shipped_at)}</p>
                      </div>
                    </div>
                  ` : ''}
                  ${currentReturn.delivered_at ? `
                    <div class="timeline-item">
                      <div class="timeline-dot active"></div>
                      <div class="timeline-content">
                        <h4>Item Delivered</h4>
                        <p>${formatDate(currentReturn.delivered_at)}</p>
                      </div>
                    </div>
                  ` : ''}
                  ${currentReturn.completed_at ? `
                    <div class="timeline-item">
                      <div class="timeline-dot active"></div>
                      <div class="timeline-content">
                        <h4>Refund Processed</h4>
                        <p>${formatDate(currentReturn.completed_at)}</p>
                      </div>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>

            ${currentReturn.dispute ? `
              <div class="detail-section full-width">
                <h3>⚖️ Related Dispute</h3>
                <div class="detail-card">
                  <div class="detail-row">
                    <span class="detail-label">Dispute Status</span>
                    <span class="detail-value">
                      <span class="status-badge ${currentReturn.dispute.status}">${formatStatus(currentReturn.dispute.status)}</span>
                    </span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Issue Type</span>
                    <span class="detail-value">${formatReasonType(currentReturn.dispute.reason_type)}</span>
                  </div>
                  ${currentReturn.dispute.requested_refund_amount ? `
                    <div class="detail-row">
                      <span class="detail-label">Requested Refund</span>
                      <span class="detail-value">£${currentReturn.dispute.requested_refund_amount.toFixed(2)}</span>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : ''}
          </div>

          ${currentReturn.status === 'delivered' && !currentReturn.stripe_refund_id ? `
            <div class="resolution-form" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%); border-color: rgba(16, 185, 129, 0.3);">
              <h3 style="color: var(--status-success);">💰 Process Refund</h3>
              <p style="margin-bottom: 16px; color: var(--text-secondary);">Item has been returned. Process the refund to complete this return.</p>
              <div class="amount-input">
                <label>Refund Amount:</label>
                <span>£</span>
                <input type="number" id="returnRefundAmount" step="0.01" min="0.01" max="${currentReturn.order.amount}" value="${currentReturn.order.amount.toFixed(2)}">
                <span style="color: var(--text-muted); font-size: 13px;">of £${currentReturn.order.amount.toFixed(2)} max</span>
              </div>
              <div class="resolution-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="processReturnRefund('${currentReturn.id}')">
                  💰 Process Refund
                </button>
              </div>
            </div>
          ` : ''}

          ${currentReturn.stripe_refund_id ? `
            <div class="resolved-banner">
              <h3>✅ Refund Processed</h3>
              <div class="resolved-details">
                <div class="detail-row">
                  <span class="detail-label">Refund Amount</span>
                  <span class="detail-value" style="color: var(--brand-green); font-weight: 600;">£${currentReturn.refund_amount?.toFixed(2) || currentReturn.order.amount.toFixed(2)}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Refund ID</span>
                  <span class="detail-value" style="font-family: monospace; font-size: 11px;">${currentReturn.stripe_refund_id}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Completed On</span>
                  <span class="detail-value">${formatDate(currentReturn.completed_at)}</span>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Admin Actions -->
          ${!currentReturn.stripe_refund_id && currentReturn.status !== 'completed' && currentReturn.status !== 'cancelled' ? `
            <div class="action-buttons">
              ${currentReturn.status !== 'delivered' ? `
                <button class="btn btn-warning" onclick="updateReturnStatus('${currentReturn.id}', 'delivered')">
                  📦 Mark Delivered
                </button>
              ` : ''}
              <button class="btn btn-secondary" onclick="updateReturnStatus('${currentReturn.id}', 'cancelled')">
                ❌ Cancel Return
              </button>
            </div>
          ` : ''}
        `;
      } catch (error) {
        console.error('Open return error:', error);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load return</p></div>';
      }
    }

    // ==================== ACTIONS ====================
    async function processReturnRefund(returnId) {
      const amount = parseFloat(document.getElementById('returnRefundAmount').value);
      
      if (!amount || amount <= 0) {
        alert('Please enter a valid refund amount');
        return;
      }

      if (!confirm(`Process refund of £${amount.toFixed(2)} for this return?`)) {
        return;
      }

      try {
        const response = await apiRequest(`${API_BASE}/returns/${returnId}/refund`, {
          method: 'POST',
          body: { amount },
        });

        const data = await response.json();

        if (response.ok) {
          alert(`Refund of £${data.amount.toFixed(2)} processed successfully!`);
          closeModal();
          loadReturns();
        } else {
          alert(data.error || 'Failed to process refund');
        }
      } catch (error) {
        console.error('Refund error:', error);
        alert('Failed to process refund');
      }
    }

    async function updateReturnStatus(returnId, status) {
      const statusLabels = {
        'delivered': 'Mark as Delivered',
        'cancelled': 'Cancel Return',
      };

      if (!confirm(`Are you sure you want to ${statusLabels[status] || status}?`)) {
        return;
      }

      try {
        const response = await apiRequest(`${API_BASE}/returns/${returnId}`, {
          method: 'PATCH',
          body: { status },
        });

        if (response.ok) {
          alert(`Return status updated to ${status}`);
          closeModal();
          loadReturns();
        } else {
          alert('Failed to update return status');
        }
      } catch (error) {
        console.error('Update return error:', error);
        alert('Failed to update return status');
      }
    }

    // ==================== MODAL ====================
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      currentReturn = null;
    }
  </script>
</body>
</html>
